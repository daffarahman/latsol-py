[project]
name = "latsol-py"
version = "0.1.0"
description = "FastAPI service and CLI that generate UTBK-SNBT Pengetahuan Kuantitatif quizzes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
latsol = "latsol_py.cli:main"
latsol-api = "latsol_py.app:run"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
